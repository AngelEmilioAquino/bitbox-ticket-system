server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticket-gateway-service
  webflux:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

gateway:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    # Upper bound for a whole call to inventory-service (connect + response + body).
    # Kept above inventory lock_timeout (3s) and cold-start latency of the first request (~3s measured).
    timeout: ${INVENTORY_TIMEOUT:10s}
  stream:
    interval: 2s
  cache:
    ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Gateway health must reflect the gateway itself; Redis/RabbitMQ outages degrade features, not liveness
    redis:
      enabled: false
    rabbit:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html