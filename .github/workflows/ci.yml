name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles both modules and runs all tests, including the concurrent-purchase tests
      # against a real PostgreSQL started by Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  docker:
    name: Docker images & smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait

      - name: Smoke test through the gateway
        run: |
          set -euo pipefail
          G=http://localhost:8080
          curl -fs -X POST $G/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@bitbox.com","password":"S3cret-pass"}'
          TOKEN=$(curl -fs -X POST $G/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@bitbox.com","password":"S3cret-pass"}' | jq -r .accessToken)
          EVENT_ID=$(curl -fs -X POST http://localhost:8081/api/events -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","eventDate":"2030-01-01T20:00:00","totalTickets":1}' | jq -r .id)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/tickets/buy -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d "{\"eventId\":$EVENT_ID}")" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $G/api/tickets/buy -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d "{\"eventId\":$EVENT_ID}")" = 409

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
