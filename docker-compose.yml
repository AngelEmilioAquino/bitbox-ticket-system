# Starts the whole solution: PostgreSQL + inventory-service + ticket-gateway-service.
#   docker compose up -d --build
# Every variable has a working default; copy .env.example to .env to override them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bitbox_inventory}
      POSTGRES_USER: ${DB_USERNAME:-bitbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bitbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: bitbox/inventory-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bitbox_inventory}
      DB_USERNAME: ${DB_USERNAME:-bitbox}
      DB_PASSWORD: ${DB_PASSWORD:-bitbox}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ticket-gateway-service:
    build:
      context: .
      dockerfile: ticket-gateway-service/Dockerfile
    image: bitbox/ticket-gateway-service:latest
    environment:
      # Service name on the compose network, not localhost
      INVENTORY_BASE_URL: http://inventory-service:8081
    ports:
      - "8080:8080"
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
