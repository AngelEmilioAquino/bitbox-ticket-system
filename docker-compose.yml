# Base definition shared by every environment. Do not run it alone; use one of:
#
#   Development (default):  docker compose up -d --build --wait
#       -> also loads docker-compose.override.yml automatically (dev profile, extra debug ports)
#
#   Production-like:        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#       -> requires JWT_SECRET and DB_PASSWORD (see .env.example); only the gateway is reachable
#
# Network layout:
#   public   : ticket-gateway-service only (the single published port, 8080)
#   internal : gateway <-> inventory-service <-> postgres, with no route to/from the outside world

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bitbox_inventory}
      POSTGRES_USER: ${DB_USERNAME:-bitbox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: bitbox/inventory-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bitbox_inventory}
      DB_USERNAME: ${DB_USERNAME:-bitbox}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ticket-gateway-service:
    build:
      context: .
      dockerfile: ticket-gateway-service/Dockerfile
    image: bitbox/ticket-gateway-service:latest
    environment:
      # Service name on the internal network, not localhost
      INVENTORY_BASE_URL: http://inventory-service:8081
    ports:
      - "8080:8080"
    networks:
      - public
      - internal
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

networks:
  public:
  internal:
    # No external connectivity: containers here cannot be reached from (or reach) outside the host's Docker
    internal: true

volumes:
  postgres-data:
