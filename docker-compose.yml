services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bitbox_inventory}
      POSTGRES_USER: ${DB_USERNAME:-bitbox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Message broker: inventory publishes availability changes, the gateway consumes them
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-bitbox}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Availability cache shared by every SSE subscriber of the gateway
  redis:
    image: redis:7-alpine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: bitbox/inventory-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bitbox_inventory}
      DB_USERNAME: ${DB_USERNAME:-bitbox}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-bitbox}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ticket-gateway-service:
    build:
      context: .
      dockerfile: ticket-gateway-service/Dockerfile
    image: bitbox/ticket-gateway-service:latest
    environment:
      # Service names on the internal network, not localhost
      INVENTORY_BASE_URL: http://inventory-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-bitbox}
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - public
      - internal
    depends_on:
      inventory-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

networks:
  public:
  internal:
    # No external connectivity: containers here cannot be reached from (or reach) outside the host's Docker
    internal: true

volumes:
  postgres-data:
