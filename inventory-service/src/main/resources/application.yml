server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET lock_timeout TO '3s'
  jpa:
    # Lazy associations + OSIV hide N+1 queries and keep connections busy for the whole request
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only verifies the mapping matches it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # REQUIRED outside the dev profile
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

security:
  jwt:
    # REQUIRED, no default: the app refuses to start without it
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: bitbox-inventory-service

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Purchases keep working if RabbitMQ is down (publishing is best effort), so it must not mark us unhealthy
    rabbit:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
