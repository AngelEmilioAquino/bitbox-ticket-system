server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bitbox_inventory}
    username: ${DB_USERNAME:bitbox}
    password: ${DB_PASSWORD:bitbox}
    hikari:
      # Bounds how long a purchase may wait for the event row lock under extreme contention;
      # exceeding it is reported as a retryable 503 instead of hanging the request.
      connection-init-sql: SET lock_timeout TO '5s'
  jpa:
    # Lazy associations + OSIV hide N+1 queries and keep connections busy for the whole request
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only verifies the mapping matches it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

security:
  jwt:
    # DEV-ONLY default so the project starts out of the box. Override JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: bitbox-inventory-service

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
