server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET lock_timeout TO '3s'
  jpa:
    # Lazy associations + OSIV hide N+1 queries and keep connections busy for the whole request
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only verifies the mapping matches it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

security:
  jwt:
    # REQUIRED, no default: the app refuses to start without it (dev values live in application-dev.yml)
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: bitbox-inventory-service

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
