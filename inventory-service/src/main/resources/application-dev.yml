# Local development profile ONLY (SPRING_PROFILES_ACTIVE=dev).
# These values are public and predictable on purpose; they must never be used outside a developer machine.
# Any other environment must provide DB_URL, DB_USERNAME, DB_PASSWORD and JWT_SECRET explicitly.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bitbox_inventory}
    username: ${DB_USERNAME:bitbox}
    password: ${DB_PASSWORD:bitbox}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
