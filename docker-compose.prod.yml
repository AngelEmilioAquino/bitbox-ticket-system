# PRODUCTION overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for production}

  rabbitmq:
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for production}

  redis:
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}"]
    environment:
      # Lets the healthcheck's redis-cli authenticate
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}

  inventory-service:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production (openssl rand -base64 48)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for production}

  ticket-gateway-service:
    restart: unless-stopped
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set for production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
